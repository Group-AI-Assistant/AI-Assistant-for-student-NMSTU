<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Бенчмарк ИИ-ассистента</title>

    <style>
        :root {
            --primary: #323c8d;
            --primary-dark: #252d70;
            --light: #f3f4fa;
            --text: #20233a;
            --muted: #62677a;
            --border: #e3e5ee;
            --success: #1b873f;
            --warning: #b37400;
            --danger: #a32121;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: var(--light);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        main {
            max-width: 1050px;
            margin: auto;
        }

        .panel, .result {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 14px rgba(50, 60, 141, 0.04);
        }

        h1, h2, h3 {
            color: var(--primary);
            margin-top: 0;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        button, a.button {
            display: inline-flex;
            align-items: center;
            border: 0;
            border-radius: 7px;
            padding: 10px 18px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
        }

        button:hover, a.button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            opacity: .55;
            cursor: wait;
        }

        .btn-outline {
            background: white;
            color: var(--primary);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: #f0f2fa;
            color: var(--primary-dark);
        }

        #status {
            margin-top: 14px;
            color: var(--muted);
            white-space: pre-wrap;
            font-weight: 500;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .metric-box {
            background: #fafaff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
        }

        .metric-box .num {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .metric-box .label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-high {
            background: #e6f7ec;
            color: var(--success);
            border: 1px solid #b8ebca;
        }

        .badge-mid {
            background: #fff8e6;
            color: var(--warning);
            border: 1px solid #ffe199;
        }

        .badge-low {
            background: #fde8e8;
            color: var(--danger);
            border: 1px solid #f9bcbc;
        }

        .badge-info {
            background: #e8eaff;
            color: var(--primary);
            border: 1px solid #cfd3ff;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .section-label {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-weight: 700;
            margin: 10px 0 4px;
        }

        .answer-box {
            background: #fafaff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .ref-box {
            background: #f4fbf6;
            border: 1px solid #c9ebd4;
            border-radius: 8px;
            padding: 10px 14px;
            white-space: pre-wrap;
            line-height: 1.45;
        }

        .sources-list {
            margin: 4px 0 0;
            padding-left: 20px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .no-sources {
            font-size: 0.85rem;
            color: var(--muted);
            font-style: italic;
            margin-top: 4px;
        }

        .hint {
            font-size: 0.88rem;
            color: var(--muted);
            line-height: 1.45;
        }

        .error {
            color: var(--danger);
        }
    </style>
</head>

<body>
<main>
    <section class="panel">
        <h1>Бенчмарк ИИ-ассистента</h1>

        <p class="hint">
            Тестирование вопросов из файла <code>data/Вопросы для Benchmark.txt</code>.
            
        </p>

        <div class="actions">
            <button id="runButton">Запустить бенчмарк</button>
            <button id="saveButton" disabled>Сохранить отчёт на сервере</button>
            <button id="downloadButton" class="btn-outline" disabled>Скачать JSON</button>
            <a class="button btn-outline" href="/">← К ассистенту</a>
        </div>

        <div id="status"></div>
    </section>

    <section id="results"></section>
</main>

<script>
    const runButton = document.getElementById("runButton");
    const saveButton = document.getElementById("saveButton");
    const downloadButton = document.getElementById("downloadButton");
    const statusElement = document.getElementById("status");
    const resultsElement = document.getElementById("results");

    let lastReport = null;

    function getAccuracyBadgeClass(acc) {
        if (acc >= 75) return "badge-high";
        if (acc >= 50) return "badge-mid";
        return "badge-low";
    }

    function renderReport(report) {
        resultsElement.replaceChildren();

        const summary = document.createElement("section");
        summary.className = "panel";

        const title = document.createElement("h2");
        title.textContent = "Итоги бенчмарка";

        const desc = document.createElement("p");
        desc.className = "hint";
        desc.textContent = `Модель: ${report.model} | Протестировано вопросов: ${report.question_count} | Дата: ${report.created_at}`;

        const grid = document.createElement("div");
        grid.className = "summary-grid";

        grid.innerHTML = `
            <div class="metric-box">
                <div class="num">${report.average_accuracy}%</div>
                <div class="label">Средняя точность</div>
            </div>
            <div class="metric-box">
                <div class="num">${report.average_distance}</div>
                <div class="label">Среднее косинусное расстояние</div>
            </div>
            <div class="metric-box">
                <div class="num">${report.average_seconds} с</div>
                <div class="label">Среднее время ответа</div>
            </div>
        `;

        summary.append(title, desc, grid);
        resultsElement.appendChild(summary);

        for (const item of report.results) {
            const card = document.createElement("article");
            card.className = "result";

            const qTitle = document.createElement("h3");
            qTitle.textContent = `${item.number}. ${item.question}`;

            const metaRow = document.createElement("div");
            metaRow.className = "meta-row";

            const accBadge = document.createElement("span");
            accBadge.className = `badge ${getAccuracyBadgeClass(item.accuracy)}`;
            accBadge.textContent = `Точность: ${item.accuracy}%`;

            const srcBadge = document.createElement("span");
            srcBadge.className = "badge badge-info";
            srcBadge.textContent = `Источников: ${item.relevant_sources_count}`;

            const distSpan = document.createElement("span");
            distSpan.innerHTML = `Косинусное расст.: <strong>${item.cosine_distance}</strong>`;

            const evalSpan = document.createElement("span");
            evalSpan.textContent = `(${item.eval_target})`;

            const timeSpan = document.createElement("span");
            timeSpan.textContent = `⏱ ${item.seconds} с`;

            metaRow.append(accBadge, srcBadge, distSpan, evalSpan, timeSpan);
            card.append(qTitle, metaRow);

            if (item.reference) {
                const refLabel = document.createElement("div");
                refLabel.className = "section-label";
                refLabel.textContent = "Эталонный ответ:";

                const refBox = document.createElement("div");
                refBox.className = "ref-box";
                refBox.textContent = item.reference;

                card.append(refLabel, refBox);
            }

            const ansLabel = document.createElement("div");
            ansLabel.className = "section-label";
            ansLabel.textContent = "Ответ ИИ-ассистента:";

            const ansBox = document.createElement("div");
            ansBox.className = "answer-box";
            ansBox.textContent = item.error ? `Ошибка: ${item.error}` : (item.answer || "(пустой ответ)");

            card.append(ansLabel, ansBox);

            // ОТОБРАЖЕНИЕ ТОЧНОГО КОЛИЧЕСТВА ИСТОЧНИКОВ
            const srcLabel = document.createElement("div");
            srcLabel.className = "section-label";
            srcLabel.textContent = `Релевантные источники (${item.relevant_sources_count}):`;
            card.append(srcLabel);

            if (item.sources && item.sources.length > 0) {
                const srcList = document.createElement("ul");
                srcList.className = "sources-list";

                for (const src of item.sources) {
                    const li = document.createElement("li");
                    li.textContent = typeof src === "string" ? src : (src.text || JSON.stringify(src));
                    srcList.appendChild(li);
                }
                card.append(srcList);
            } else {
                const noSrc = document.createElement("div");
                noSrc.className = "no-sources";
                noSrc.textContent = "Релевантная информация в базе знаний не найдена.";
                card.append(noSrc);
            }

            resultsElement.appendChild(card);
        }
    }

    runButton.addEventListener("click", async () => {
        runButton.disabled = true;
        saveButton.disabled = true;
        downloadButton.disabled = true;
        lastReport = null;
        resultsElement.replaceChildren();

        statusElement.textContent = "Выполняется бенчмарк... Оцениваем вопросы и фильтруем источники.";

        try {
            const response = await fetch("/api/benchmark/run", { method: "POST" });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Не удалось запустить бенчмарк.");
            }

            lastReport = data;
            renderReport(data);

            statusElement.textContent = "Бенчмарк успешно завершён!";
            saveButton.disabled = false;
            downloadButton.disabled = false;

        } catch (error) {
            statusElement.textContent = `Ошибка: ${error.message}`;
            statusElement.className = "error";
        } finally {
            runButton.disabled = false;
        }
    });

    saveButton.addEventListener("click", async () => {
        if (!lastReport) return;
        saveButton.disabled = true;
        statusElement.textContent = "Сохраняем отчёт на сервере...";

        try {
            const response = await fetch("/api/benchmark/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(lastReport)
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Не удалось сохранить отчёт.");

            statusElement.textContent = `Отчёт успешно сохранён: ${data.filename}`;
        } catch (error) {
            statusElement.textContent = `Ошибка сохранения: ${error.message}`;
            saveButton.disabled = false;
        }
    });

    downloadButton.addEventListener("click", () => {
        if (!lastReport) return;
        const blob = new Blob([JSON.stringify(lastReport, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `benchmark_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "_")}.json`;
        a.click();
        URL.revokeObjectURL(url);
    });
</script>
</body>
</html>
