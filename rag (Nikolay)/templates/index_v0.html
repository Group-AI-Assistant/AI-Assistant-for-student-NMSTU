<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локальный RAG ИИ-Ассистент</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 800px; height: 90vh; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #323C8D; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: bold; }
        .clear-btn { background: #D3D3D3 ; color: #323C8D; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .clear-btn:hover { background: #D3D3D3; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
        .user-message { align-self: flex-end; background: #e3f2fd; color: #0d47a1; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background: #ffffff; color: #212121; border: 1px solid #e0e0e0; border-bottom-left-radius: 2px; }
        .sources-block { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ccc; font-size: 0.8rem; color: #666; }
        .source-item { background: #f1f3f4; padding: 4px 8px; border-radius: 4px; margin-top: 4px; }
        .chat-input-area { padding: 16px; background: #ffffff; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 12px; border: 1px solid #cccccc; border-radius: 8px; outline: none; font-size: 1rem; }
        .chat-input:focus { border-color: #323C8D; }
        .send-btn { background: #323C8D; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .send-btn:hover { background: #1557b0; }
        .loading { font-style: italic; color: #888; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>ИИ-Ассистент МГТУ им. Г. И. Носова</span>
        <button class="clear-btn" onclick="clearHistory()">Очистить диалог</button>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">
            Здравствуйте! Задайте мне любой вопрос по вашей локальной базе знаний.
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" class="chat-input" placeholder="Введите ваш вопрос..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const query = input.value.trim();
        if (!query) return;

        const chatBox = document.getElementById('chatBox');

        // Выводим сообщение пользователя
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.textContent = query;
        chatBox.appendChild(userDiv);

        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Показываем индикатор загрузки
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-message loading';
        loadingDiv.id = 'loadingIndicator';
        loadingDiv.textContent = 'Ищу ответ в базе знаний...';
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Отправляем запрос на наш Python бэкенд
            const response = await fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });

            const data = await response.json();
            
            // Удаляем индикатор загрузки
            document.getElementById('loadingIndicator').remove();

            // Создаем блок с ответом ИИ
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            
            let textHtml = data.answer.replace(/\n/g, '<br>');
            botDiv.innerHTML = textHtml;

            // Если есть источники (чанки), выводим их
            if (data.sources && data.sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'sources-block';
                sourcesDiv.innerHTML = '<b>Найденные источники:</b>';
                data.sources.forEach((src, idx) => {
                    const srcItem = document.createElement('div');
                    srcItem.className = 'source-item';
                    srcItem.textContent = `[${idx+1}] ${src.substring(0, 100)}...`;
                    sourcesDiv.appendChild(srcItem);
                });
                botDiv.appendChild(sourcesDiv);
            }

            chatBox.appendChild(botDiv);

        } catch (error) {
            document.getElementById('loadingIndicator').remove();
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message bot-message';
            errorDiv.style.color = 'red';
            errorDiv.textContent = 'Ошибка при получении ответа от сервера.';
            chatBox.appendChild(errorDiv);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function clearHistory() {
        await fetch('/api/clear', { method: 'POST' });
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '<div class="message bot-message">Память очищена! Начните новый диалог.</div>';
    }
</script>

</body>
</html>
