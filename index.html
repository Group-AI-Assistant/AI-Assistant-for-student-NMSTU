<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с ИИ-ассистентом</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 20px;
            background: #2d3b4f;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #1e2a38;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fafcff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .message.user {
            background: #e1ecf9;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            background: #f0f4fa;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e6edf5;
            gap: 12px;
            align-items: center;
        }
        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #dce4ec;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        #userInput:focus {
            border-color: #2d3b4f;
        }
        #sendBtn {
            background: #2d3b4f;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }
        #sendBtn:hover {
            background: #1e2a38;
        }
        #sendBtn:disabled {
            background: #a0b0c0;
            cursor: not-allowed;
        }
        .typing-indicator {
            color: #6a7b8c;
            font-style: italic;
            padding: 8px 16px;
            align-self: flex-start;
        }
        .error {
            color: #c0392b;
            background: #fde8e5;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">🧠 Ваш ИИ-ассистент (RAG)</div>
    <div class="messages" id="messages">
        <div class="message bot">Привет! Чем могу помочь?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Напишите сообщение..." autofocus />
        <button id="sendBtn">Отправить</button>
    </div>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Адрес вашего llama-server (можете изменить порт/хост)
    const API_URL = 'http://127.0.0.1:8080/v1/chat/completions';

    // История диалога (храним сообщения для отправки)
    let conversation = [
        { role: 'system', content: 'Ты — полезный и вежливый ассистент, который отвечает на русском языке.' }
    ];

    // Функция добавления сообщения в интерфейс
    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.textContent = text;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Показать индикатор "печатает"
    function showTyping() {
        const typing = document.createElement('div');
        typing.className = 'typing-indicator';
        typing.id = 'typing';
        typing.textContent = 'Ассистент печатает...';
        messagesDiv.appendChild(typing);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typing');
        if (el) el.remove();
    }

    // Отправить запрос к модели
    async function sendMessage() {
        const userText = userInput.value.trim();
        if (!userText) return;

        // Добавляем сообщение пользователя в интерфейс и в историю
        addMessage(userText, 'user');
        conversation.push({ role: 'user', content: userText });
        userInput.value = '';
        sendBtn.disabled = true;

        showTyping();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'ruadapt-qwen3-4b', // название не важно, главное чтобы было
                    messages: conversation,
                    temperature: 0.3,
                    max_tokens: 512,
                    stream: false
                })
            });

            hideTyping();

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Ошибка сервера (${response.status}): ${errText}`);
            }

            const data = await response.json();
            const botReply = data.choices[0].message.content;

            // Добавляем ответ бота
            addMessage(botReply, 'bot');
            conversation.push({ role: 'assistant', content: botReply });

        } catch (error) {
            hideTyping();
            addMessage(`❌ Ошибка: ${error.message}`, 'bot');
            console.error(error);
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // Обработчики событий
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // При загрузке фокус на поле ввода
    window.addEventListener('load', () => userInput.focus());
</script>
</body>
</html>
